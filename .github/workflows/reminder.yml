name: Check Skincare Reminders

on:
  schedule:
    # Runs every 30 minutes to check if routine times have passed
    - cron: '*/30 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  check-reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Reminder Check
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_CALLMEBOT_PHONE: ${{ secrets.VITE_CALLMEBOT_PHONE }}
          VITE_CALLMEBOT_API_KEY: ${{ secrets.VITE_CALLMEBOT_API_KEY }}
        run: node scripts/check-reminders.js
